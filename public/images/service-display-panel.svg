<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="panelDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="#050914"/>

  <!-- Telemetry Header -->
  <text x="40" y="50" fill="#38BDF8" font-family="monospace" font-size="12" letter-spacing="2">ROYALTECHLABS // DISPLAY PANEL BONDING &amp; COF TAPE GATE DIAGNOSTICS</text>
  <text x="630" y="50" fill="#F59E0B" font-family="monospace" font-size="12">VGH: 28V / VGL: -6V</text>
  <line x1="40" y1="65" x2="760" y2="65" stroke="#1E293B" stroke-width="1.5"/>

  <!-- TV Screen Panel with test lines -->
  <rect x="80" y="90" width="640" height="380" rx="12" fill="url(#panelDark)" stroke="#475569" stroke-width="3"/>

  <!-- Realistic Vertical Diagnostic Lines Pattern -->
  <g opacity="0.9">
    <line x1="220" y1="90" x2="220" y2="470" stroke="#00E5FF" stroke-width="2"/>
    <line x1="223" y1="90" x2="223" y2="470" stroke="#EF4444" stroke-width="1.5"/>
    <line x1="226" y1="90" x2="226" y2="470" stroke="#10B981" stroke-width="1"/>
    
    <line x1="480" y1="90" x2="480" y2="470" stroke="#F59E0B" stroke-width="3"/>
    <line x1="485" y1="90" x2="485" y2="470" stroke="#6366F1" stroke-width="1.5"/>
    <line x1="488" y1="90" x2="488" y2="470" stroke="#EC4899" stroke-width="2"/>
  </g>

  <!-- Split Screen Diagnostic Pattern (Color Bar on right half) -->
  <g opacity="0.85">
    <rect x="540" y="100" width="30" height="360" fill="#FFFFFF"/>
    <rect x="570" y="100" width="30" height="360" fill="#FACC15"/>
    <rect x="600" y="100" width="30" height="360" fill="#22D3EE"/>
    <rect x="630" y="100" width="30" height="360" fill="#4ADE80"/>
    <rect x="660" y="100" width="30" height="360" fill="#F43F5E"/>
    <rect x="690" y="100" width="20" height="360" fill="#3B82F6"/>
  </g>

  <!-- COF Gate Driver Ribbon Inspection at bottom edge -->
  <g transform="translate(180, 470)">
    <rect x="0" y="0" width="70" height="35" rx="2" fill="#D97706" stroke="#FDE68A" stroke-width="1"/>
    <rect x="25" y="10" width="20" height="15" rx="1" fill="#000000"/>
    <text x="35" y="22" fill="#FFFFFF" font-family="monospace" font-size="7" text-anchor="middle">COF</text>
    
    <rect x="120" y="0" width="70" height="35" rx="2" fill="#D97706" stroke="#FDE68A" stroke-width="1"/>
    <rect x="145" y="10" width="20" height="15" rx="1" fill="#000000"/>
    <text x="155" y="22" fill="#FFFFFF" font-family="monospace" font-size="7" text-anchor="middle">COF</text>

    <rect x="240" y="0" width="70" height="35" rx="2" fill="#D97706" stroke="#FDE68A" stroke-width="1"/>
    <rect x="265" y="10" width="20" height="15" rx="1" fill="#000000"/>
    <text x="275" y="22" fill="#FFFFFF" font-family="monospace" font-size="7" text-anchor="middle">COF</text>

    <rect x="360" y="0" width="70" height="35" rx="2" fill="#D97706" stroke="#FDE68A" stroke-width="1"/>
    <rect x="385" y="10" width="20" height="15" rx="1" fill="#000000"/>
    <text x="395" y="22" fill="#FFFFFF" font-family="monospace" font-size="7" text-anchor="middle">COF</text>
  </g>

  <!-- Diagnostic Callout Overlay -->
  <g transform="translate(100, 240)">
    <rect x="0" y="0" width="240" height="90" rx="10" fill="#020617" stroke="#00E5FF" stroke-width="1.5" opacity="0.95"/>
    <text x="15" y="25" fill="#00E5FF" font-family="monospace" font-size="11" font-weight="bold">T-CON / COF TAPE TEST</text>
    <text x="15" y="45" fill="#E2E8F0" font-family="sans-serif" font-size="11">Vertical line bypass circuit viable</text>
    <text x="15" y="65" fill="#94A3B8" font-family="sans-serif" font-size="10">No expensive panel replacement required</text>
    <text x="15" y="80" fill="#10B981" font-family="monospace" font-size="10">SAVINGS ESTIMATE: ~70%</text>
  </g>

  <!-- Bottom Legend -->
  <text x="80" y="555" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="bold">Honest Screen &amp; Display Panel Feasibility Check</text>
  <text x="80" y="575" fill="#94A3B8" font-family="sans-serif" font-size="11">Differentiating between non-repairable shattered physical glass vs. repairable gate-driver lines and timing board issues</text>
</svg>
