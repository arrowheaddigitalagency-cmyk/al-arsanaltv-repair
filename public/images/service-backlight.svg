<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="ledGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stripBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="#0A0F1D"/>

  <!-- Telemetry Header -->
  <text x="40" y="50" fill="#38BDF8" font-family="monospace" font-size="12" letter-spacing="2">ROYALTECHLABS // DIRECT-LIT &amp; EDGE-LED ARRAY REPAIR</text>
  <text x="600" y="50" fill="#10B981" font-family="monospace" font-size="12">TESTER: 300V / 30mA CONSTANT</text>
  <line x1="40" y1="65" x2="760" y2="65" stroke="#1E293B" stroke-width="1.5"/>

  <!-- TV Chassis Cutaway -->
  <rect x="60" y="90" width="680" height="420" rx="14" fill="#030712" stroke="#334155" stroke-width="3"/>
  <rect x="80" y="110" width="640" height="380" rx="8" fill="#020617"/>

  <!-- 4 Parallel Aluminum LED Backlight Strips -->
  <!-- Strip 1 -->
  <rect x="110" y="140" width="580" height="24" rx="4" fill="url(#stripBg)"/>
  <circle cx="160" cy="152" r="32" fill="url(#ledGlow)"/>
  <circle cx="160" cy="152" r="8" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="280" cy="152" r="32" fill="url(#ledGlow)"/>
  <circle cx="280" cy="152" r="8" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="400" cy="152" r="32" fill="url(#ledGlow)"/>
  <circle cx="400" cy="152" r="8" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="520" cy="152" r="32" fill="url(#ledGlow)"/>
  <circle cx="520" cy="152" r="8" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="630" cy="152" r="32" fill="url(#ledGlow)"/>
  <circle cx="630" cy="152" r="8" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2"/>

  <!-- Strip 2 -->
  <rect x="110" y="220" width="580" height="24" rx="4" fill="url(#stripBg)"/>
  <circle cx="160" cy="232" r="32" fill="url(#ledGlow)"/>
  <circle cx="160" cy="232" r="8" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="280" cy="232" r="32" fill="url(#ledGlow)"/>
  <circle cx="280" cy="232" r="8" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="400" cy="232" r="32" fill="url(#ledGlow)"/>
  <circle cx="400" cy="232" r="8" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="520" cy="232" r="32" fill="url(#ledGlow)"/>
  <circle cx="520" cy="232" r="8" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="630" cy="232" r="32" fill="url(#ledGlow)"/>
  <circle cx="630" cy="232" r="8" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2"/>

  <!-- Strip 3 -->
  <rect x="110" y="300" width="580" height="24" rx="4" fill="url(#stripBg)"/>
  <circle cx="160" cy="312" r="32" fill="url(#ledGlow)"/>
  <circle cx="160" cy="312" r="8" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="280" cy="312" r="32" fill="url(#ledGlow)"/>
  <circle cx="280" cy="312" r="8" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="400" cy="312" r="32" fill="url(#ledGlow)"/>
  <circle cx="400" cy="312" r="8" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="520" cy="312" r="32" fill="url(#ledGlow)"/>
  <circle cx="520" cy="312" r="8" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="630" cy="312" r="32" fill="url(#ledGlow)"/>
  <circle cx="630" cy="312" r="8" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2"/>

  <!-- Strip 4 (Showing diagnostic probe testing) -->
  <rect x="110" y="380" width="580" height="24" rx="4" fill="url(#stripBg)"/>
  <circle cx="160" cy="392" r="32" fill="url(#ledGlow)"/>
  <circle cx="160" cy="392" r="8" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="280" cy="392" r="32" fill="url(#ledGlow)"/>
  <circle cx="280" cy="392" r="8" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2"/>
  
  <!-- Probe indicator -->
  <g transform="translate(400, 392)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#EF4444" stroke-width="2" stroke-dasharray="2 2"/>
    <text x="24" y="-5" fill="#EF4444" font-family="monospace" font-size="10" font-weight="bold">PROBE V+: 78.4V</text>
  </g>

  <!-- Bottom Technical Legend -->
  <text x="80" y="545" fill="#F8FAFC" font-family="sans-serif" font-size="13" font-weight="bold">Aluminum-Substrate LED Strips (Direct Factory Fit)</text>
  <text x="80" y="565" fill="#94A3B8" font-family="sans-serif" font-size="11">Zero dark spots • Enhanced heat dissipation • Fixes sound-without-picture fault permanently</text>
</svg>
