<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="pcbGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="50%" stop-color="#042F2E"/>
      <stop offset="100%" stop-color="#021E19"/>
    </linearGradient>
    <linearGradient id="goldTrace" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="#080E1C"/>
  
  <!-- Circuit PCB Board -->
  <rect x="50" y="40" width="700" height="520" rx="16" fill="url(#pcbGreen)" stroke="#10B981" stroke-width="2"/>

  <!-- Telemetry Header on PCB -->
  <text x="80" y="80" fill="#6EE7B7" font-family="monospace" font-size="12" letter-spacing="2">ROYALTECHLABS // MAINBOARD COMPONENT-LEVEL SOLDERING LAB</text>
  <text x="610" y="80" fill="#FCD34D" font-family="monospace" font-size="11">BGA REFLOW: ACTIVE</text>

  <!-- Copper Bus Traces -->
  <g stroke="url(#goldTrace)" stroke-width="2.5" fill="none" opacity="0.8">
    <path d="M100 120 L240 120 L280 160 L400 160"/>
    <path d="M100 140 L230 140 L270 180 L400 180"/>
    <path d="M100 160 L220 160 L260 200 L400 200"/>
    
    <path d="M400 320 L400 420 L460 480 L650 480"/>
    <path d="M420 320 L420 410 L475 465 L650 465"/>
    <path d="M440 320 L440 400 L490 450 L650 450"/>
  </g>

  <!-- Main Processor IC -->
  <rect x="300" y="160" width="200" height="160" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="3"/>
  <rect x="320" y="180" width="160" height="120" rx="4" fill="#020617"/>
  <text x="400" y="235" fill="#F8FAFC" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">ARM-V9 PROCESSOR</text>
  <text x="400" y="258" fill="#38BDF8" font-family="monospace" font-size="11" text-anchor="middle">VIDEO DSP CONTROLLER</text>
  <circle cx="335" cy="195" r="4" fill="#F59E0B"/>

  <!-- Micro Soldering Probes Graphic -->
  <g transform="translate(480, 260) rotate(-35)">
    <line x1="0" y1="0" x2="160" y2="0" stroke="#94A3B8" stroke-width="8" stroke-linecap="round"/>
    <polygon points="0,0 -20,-4 -20,4" fill="#E2E8F0"/>
    <circle cx="0" cy="0" r="8" fill="#00E5FF" opacity="0.6"/>
  </g>
  <g transform="translate(320, 280) rotate(215)">
    <line x1="0" y1="0" x2="160" y2="0" stroke="#EF4444" stroke-width="8" stroke-linecap="round"/>
    <polygon points="0,0 -20,-4 -20,4" fill="#E2E8F0"/>
    <circle cx="0" cy="0" r="8" fill="#EF4444" opacity="0.6"/>
  </g>

  <!-- Capacitors & Resistors around Board -->
  <g fill="#1E293B" stroke="#64748B" stroke-width="1.5">
    <circle cx="150" cy="240" r="18" fill="#334155" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="150" cy="300" r="18" fill="#334155" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="150" cy="360" r="18" fill="#334155" stroke="#F59E0B" stroke-width="2"/>
    <rect x="220" y="320" width="30" height="15" rx="3" fill="#FCD34D"/>
    <rect x="220" y="350" width="30" height="15" rx="3" fill="#FCD34D"/>
    
    <!-- EEPROM 8-pin IC -->
    <rect x="560" y="180" width="70" height="50" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <text x="595" y="210" fill="#38BDF8" font-family="monospace" font-size="10" text-anchor="middle">EEPROM</text>
  </g>

  <!-- Telemetry readout panel -->
  <rect x="80" y="470" width="360" height="70" rx="8" fill="#022C22" stroke="#059669" stroke-width="1"/>
  <text x="100" y="495" fill="#6EE7B7" font-family="monospace" font-size="11" font-weight="bold">MICRO-SOLDERING VS FULL BOARD REPLACEMENT</text>
  <text x="100" y="515" fill="#A7F3D0" font-family="sans-serif" font-size="10">Save up to 60% of repair cost with component-level trace repair &amp; IC re-soldering</text>
</svg>
