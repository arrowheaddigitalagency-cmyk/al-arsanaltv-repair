<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="scopeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022C22"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="#070D1A"/>

  <!-- Telemetry Header -->
  <text x="40" y="45" fill="#38BDF8" font-family="monospace" font-size="12" letter-spacing="2">ROYALTECHLABS // ADVANCED ELECTRONICS DIAGNOSTIC SUITE</text>
  <text x="610" y="45" fill="#10B981" font-family="monospace" font-size="12">CALIBRATION: ISO 9001</text>
  <line x1="40" y1="60" x2="760" y2="60" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Oscilloscope Unit -->
  <g transform="translate(60, 90)">
    <rect x="0" y="0" width="420" height="280" rx="14" fill="#0F172A" stroke="#334155" stroke-width="3"/>
    
    <!-- Oscilloscope Display Screen -->
    <rect x="25" y="25" width="280" height="200" rx="8" fill="url(#scopeGrad)" stroke="#10B981" stroke-width="1.5"/>
    
    <!-- Screen Grid -->
    <g stroke="#059669" stroke-width="0.75" opacity="0.4">
      <line x1="25" y1="75" x2="305" y2="75"/>
      <line x1="25" y1="125" x2="305" y2="125"/>
      <line x1="25" y1="175" x2="305" y2="175"/>
      <line x1="95" y1="25" x2="95" y2="225"/>
      <line x1="165" y1="25" x2="165" y2="225"/>
      <line x1="235" y1="25" x2="235" y2="225"/>
    </g>

    <!-- Signal Sine Waveform -->
    <path d="M 25 125 Q 60 45, 95 125 T 165 125 T 235 125 T 305 125" 
          fill="none" stroke="#34D399" stroke-width="2.5"/>
    <!-- Signal Square Waveform (PWM) -->
    <path d="M 25 165 L 50 165 L 50 145 L 85 145 L 85 165 L 120 165 L 120 145 L 155 145 L 155 165 L 190 165 L 190 145 L 225 145 L 225 165 L 260 165 L 260 145 L 295 145" 
          fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.85"/>

    <text x="35" y="45" fill="#34D399" font-family="monospace" font-size="10">CH1: 3.32V 100MHz</text>
    <text x="35" y="60" fill="#38BDF8" font-family="monospace" font-size="10">CH2: PWM BACKLIGHT CLK</text>

    <!-- Control Knobs and Ports on right of Scope -->
    <g transform="translate(325, 30)">
      <circle cx="20" cy="20" r="14" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
      <circle cx="60" cy="20" r="14" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
      <circle cx="20" cy="65" r="14" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
      <circle cx="60" cy="65" r="14" fill="#1E293B" stroke="#64748B" stroke-width="2"/>

      <!-- BNC Cable connectors -->
      <circle cx="20" cy="140" r="12" fill="#020617" stroke="#F59E0B" stroke-width="2"/>
      <circle cx="60" cy="140" r="12" fill="#020617" stroke="#38BDF8" stroke-width="2"/>
      <text x="40" y="180" fill="#94A3B8" font-family="monospace" font-size="9" text-anchor="middle">INPUT BNC</text>
    </g>
  </g>

  <!-- Precision Digital Multimeter Unit -->
  <g transform="translate(510, 90)">
    <rect x="0" y="0" width="230" height="280" rx="14" fill="#F59E0B" stroke="#D97706" stroke-width="3"/>
    <rect x="15" y="15" width="200" height="250" rx="10" fill="#0F172A"/>

    <!-- LCD Display -->
    <rect x="25" y="25" width="180" height="70" rx="6" fill="#84CC16" stroke="#4D7C0F" stroke-width="1.5"/>
    <text x="115" y="68" fill="#14532D" font-family="monospace" font-size="28" font-weight="bold" text-anchor="middle">12.04 V</text>
    <text x="180" y="45" fill="#14532D" font-family="monospace" font-size="10" font-weight="bold">DC AUTO</text>

    <!-- Dial Selector -->
    <circle cx="115" cy="160" r="45" fill="#1E293B" stroke="#475569" stroke-width="3"/>
    <line x1="115" y1="160" x2="115" y2="125" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Probes Sockets -->
    <circle cx="70" cy="235" r="10" fill="#000000" stroke="#EF4444" stroke-width="3"/>
    <circle cx="115" cy="235" r="10" fill="#000000" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="160" cy="235" r="10" fill="#000000" stroke="#38BDF8" stroke-width="3"/>
  </g>

  <!-- Antistatic ESD Workbench Mat at Bottom -->
  <rect x="60" y="390" width="680" height="170" rx="12" fill="#1E3A8A" stroke="#3B82F6" stroke-width="2" opacity="0.7"/>
  <text x="80" y="425" fill="#93C5FD" font-family="monospace" font-size="12" font-weight="bold">ROYALTECHLABS BENCH TELEMETRY</text>
  
  <g transform="translate(80, 445)">
    <rect x="0" y="0" width="190" height="85" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="15" y="25" fill="#38BDF8" font-family="monospace" font-size="10">MULTIMETER CALIBRATION</text>
    <text x="15" y="48" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">0.05% Accuracy</text>
    <text x="15" y="68" fill="#10B981" font-family="monospace" font-size="10">DC Voltage &amp; Ripple Safe</text>
  </g>

  <g transform="translate(295, 445)">
    <rect x="0" y="0" width="190" height="85" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="15" y="25" fill="#38BDF8" font-family="monospace" font-size="10">OSCILLOSCOPE PROBING</text>
    <text x="15" y="48" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">100 MHz Real-Time</text>
    <text x="15" y="68" fill="#10B981" font-family="monospace" font-size="10">LVDS / T-Con Clock Analysed</text>
  </g>

  <g transform="translate(510, 445)">
    <rect x="0" y="0" width="210" height="85" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="15" y="25" fill="#38BDF8" font-family="monospace" font-size="10">COMPONENT REPAIR RATE</text>
    <text x="15" y="48" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">98% Fixed At Doorstep</text>
    <text x="15" y="68" fill="#10B981" font-family="monospace" font-size="10">Full In-Home Lab Testing</text>
  </g>
</svg>
