<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="psuAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451A03"/>
      <stop offset="50%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#261005"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="#060A14"/>

  <!-- Telemetry Header -->
  <text x="40" y="50" fill="#F59E0B" font-family="monospace" font-size="12" letter-spacing="2">ROYALTECHLABS // HIGH-VOLTAGE SWITCH-MODE POWER SUPPLY (SMPS) LAB</text>
  <text x="640" y="50" fill="#10B981" font-family="monospace" font-size="12">AC: 230V / DC 12V 24V</text>
  <line x1="40" y1="65" x2="760" y2="65" stroke="#1E293B" stroke-width="1.5"/>

  <!-- PSU Board -->
  <rect x="60" y="90" width="680" height="430" rx="14" fill="url(#psuAmber)" stroke="#F59E0B" stroke-width="2"/>

  <!-- AC Input Section -->
  <g transform="translate(100, 150)">
    <rect x="0" y="0" width="80" height="50" rx="6" fill="#1E293B" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="40" y="30" fill="#FFFFFF" font-family="monospace" font-size="11" text-anchor="middle">AC MAINS</text>
    
    <!-- Fuse -->
    <rect x="100" y="15" width="40" height="20" rx="4" fill="#E2E8F0" stroke="#000000" stroke-width="1"/>
    <text x="120" y="29" fill="#000000" font-family="monospace" font-size="9" text-anchor="middle">T4A 250V</text>
  </g>

  <!-- Large High-Voltage Filter Capacitors -->
  <g transform="translate(280, 140)">
    <circle cx="50" cy="50" r="45" fill="#0F172A" stroke="#F59E0B" stroke-width="3"/>
    <circle cx="50" cy="50" r="35" fill="#1E293B"/>
    <text x="50" y="48" fill="#F59E0B" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">450V</text>
    <text x="50" y="64" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="middle">120uF</text>
    
    <circle cx="160" cy="50" r="45" fill="#0F172A" stroke="#F59E0B" stroke-width="3"/>
    <circle cx="160" cy="50" r="35" fill="#1E293B"/>
    <text x="160" y="48" fill="#F59E0B" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">450V</text>
    <text x="160" y="64" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="middle">120uF</text>
  </g>

  <!-- High-Frequency Ferrite Transformer -->
  <g transform="translate(480, 240)">
    <rect x="0" y="0" width="160" height="130" rx="10" fill="#020617" stroke="#38BDF8" stroke-width="2"/>
    <rect x="15" y="15" width="130" height="100" rx="6" fill="#0F172A"/>
    <circle cx="80" cy="65" r="35" fill="none" stroke="#F59E0B" stroke-width="6" stroke-dasharray="8 4"/>
    <text x="80" y="60" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">STEP-DOWN</text>
    <text x="80" y="76" fill="#94A3B8" font-family="monospace" font-size="9" text-anchor="middle">FERRITE CORE</text>
  </g>

  <!-- MOSFET Aluminum Heat Sink -->
  <rect x="130" y="270" width="180" height="70" rx="4" fill="#64748B" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="160" y1="270" x2="160" y2="340" stroke="#334155" stroke-width="3"/>
  <line x1="190" y1="270" x2="190" y2="340" stroke="#334155" stroke-width="3"/>
  <line x1="220" y1="270" x2="220" y2="340" stroke="#334155" stroke-width="3"/>
  <line x1="250" y1="270" x2="250" y2="340" stroke="#334155" stroke-width="3"/>
  <line x1="280" y1="270" x2="280" y2="340" stroke="#334155" stroke-width="3"/>
  <text x="220" y="360" fill="#E2E8F0" font-family="monospace" font-size="10" text-anchor="middle">PWM POWER SWITCHING MOSFETS</text>

  <!-- Multimeter Probing Status -->
  <rect x="100" y="410" width="340" height="80" rx="8" fill="#0B1329" stroke="#10B981" stroke-width="1.5"/>
  <text x="120" y="435" fill="#10B981" font-family="monospace" font-size="11" font-weight="bold">&gt; STANDBY VOLTAGE RAIL: 5.12V DC [OK]</text>
  <text x="120" y="455" fill="#38BDF8" font-family="monospace" font-size="11">&gt; 12V MAIN RAIL: 12.04V DC [STABLE]</text>
  <text x="120" y="475" fill="#FCD34D" font-family="monospace" font-size="11">&gt; 24V INVERTER RAIL: 24.10V DC [FILTER RESTORED]</text>

  <!-- Bottom Legend -->
  <text x="80" y="555" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="bold">Dead TV &amp; Clicking Relay Repair</text>
  <text x="80" y="575" fill="#94A3B8" font-family="sans-serif" font-size="11">Resolving power surges, bulging electrolytic capacitors, blown varistors, and tripping breakers</text>
</svg>
