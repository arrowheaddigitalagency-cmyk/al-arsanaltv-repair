<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSmart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14"/>
      <stop offset="100%" stop-color="#0D1B2A"/>
    </linearGradient>
    <pattern id="smartGrid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#1E293B" stroke-width="0.7" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bgSmart)"/>
  <rect width="800" height="600" fill="url(#smartGrid)"/>

  <!-- Top Header -->
  <text x="40" y="50" fill="#38BDF8" font-family="monospace" font-size="12" letter-spacing="2">ROYALTECHLABS // SMART TV OS &amp; SOC DIAGNOSTIC PROTOCOL</text>
  <text x="630" y="50" fill="#10B981" font-family="monospace" font-size="12">OTA RECOVERY: READY</text>
  <line x1="40" y1="65" x2="760" y2="65" stroke="#1E3A8A" stroke-width="1.5"/>

  <!-- Central Processor Chip Block -->
  <g transform="translate(400, 240)">
    <!-- Outer Motherboard Pins -->
    <rect x="-110" y="-110" width="220" height="220" rx="16" fill="#0B132B" stroke="#00E5FF" stroke-width="2"/>
    <rect x="-90" y="-90" width="180" height="180" rx="10" fill="#1C2541" stroke="#3A506B" stroke-width="1.5"/>
    
    <!-- Chip Core -->
    <rect x="-60" y="-60" width="120" height="120" rx="6" fill="#050814" stroke="#0062FF" stroke-width="2"/>
    <text x="0" y="-10" fill="#00E5FF" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">SMART SOC</text>
    <text x="0" y="12" fill="#94A3B8" font-family="monospace" font-size="9" text-anchor="middle">QUAD-CORE 4K</text>
    <text x="0" y="28" fill="#10B981" font-family="monospace" font-size="9" text-anchor="middle">FIRMWARE V8.4</text>

    <!-- Circuit Trace Lines radiating out -->
    <path d="M-110 -50 L-180 -50 L-220 -90" stroke="#00E5FF" stroke-width="1.5" fill="none"/>
    <circle cx="-220" cy="-90" r="4" fill="#00E5FF"/>
    <text x="-230" y="-95" fill="#38BDF8" font-family="monospace" font-size="10" text-anchor="end">WI-FI 6 DUAL-BAND</text>

    <path d="M-110 50 L-180 50 L-220 90" stroke="#10B981" stroke-width="1.5" fill="none"/>
    <circle cx="-220" cy="90" r="4" fill="#10B981"/>
    <text x="-230" y="95" fill="#10B981" font-family="monospace" font-size="10" text-anchor="end">BLUETOOTH 5.2</text>

    <path d="M110 -50 L180 -50 L220 -90" stroke="#F59E0B" stroke-width="1.5" fill="none"/>
    <circle cx="220" cy="-90" r="4" fill="#F59E0B"/>
    <text x="230" y="-95" fill="#F59E0B" font-family="monospace" font-size="10">EMMC NAND FLASH</text>

    <path d="M110 50 L180 50 L220 90" stroke="#8B5CF6" stroke-width="1.5" fill="none"/>
    <circle cx="220" cy="90" r="4" fill="#8B5CF6"/>
    <text x="230" y="95" fill="#8B5CF6" font-family="monospace" font-size="10">HDMI 2.1 eARC</text>
  </g>

  <!-- Diagnostic Terminal Log at Bottom -->
  <rect x="60" y="420" width="680" height="130" rx="12" fill="#0A0F1D" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="75" y="435" width="8" height="8" rx="4" fill="#EF4444"/>
  <rect x="90" y="435" width="8" height="8" rx="4" fill="#F59E0B"/>
  <rect x="105" y="435" width="8" height="8" rx="4" fill="#10B981"/>
  <text x="130" y="443" fill="#64748B" font-family="monospace" font-size="10">LOG TERMINAL // TV_SYS_DIAG.EXE</text>

  <text x="80" y="475" fill="#38BDF8" font-family="monospace" font-size="11">&gt; SYMPTOM: TV STUCK ON BOOT LOGO // REBOOT LOOP DETECTED</text>
  <text x="80" y="500" fill="#E2E8F0" font-family="monospace" font-size="11">&gt; DIAGNOSIS: Corrupted eMMC partition block repaired via EEPROM direct programmer</text>
  <text x="80" y="525" fill="#10B981" font-family="monospace" font-size="11">&gt; RESOLUTION: OS webOS / Tizen / Android TV reloaded • Factory test passed</text>
</svg>
